# CI backend: cek nama tak terdefinisi + pytest (PostgreSQL + pgvector) + build image Docker.
# Berjalan di setiap PR dan push ke main yang menyentuh backend/.
# Tidak memakai secret apa pun; kredensial di bawah hanya untuk database uji sementara di runner.

name: Backend CI

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: backend }

    services:
      postgres:
        # Sama dengan image di backend/docker-compose.yml
        image: ankane/pgvector:v0.5.0
        env:
          POSTGRES_USER: hero_user
          POSTGRES_PASSWORD: hero_password
          POSTGRES_DB: hero_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hero_user -d hero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://hero_user:hero_password@127.0.0.1:5432/hero_test
      DATABASE_URL: postgresql+psycopg://hero_user:hero_password@127.0.0.1:5432/hero_test
      APP_ENV: test
      AUTH_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Sama dengan backend/Dockerfile (python:3.11-slim)
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff

      # Menangkap bug seperti "import time" / "import os" yang hilang sebelum sampai ke server.
      - name: Cek nama tak terdefinisi & galat sintaks
        run: ruff check --select E9,F821,F822,F823 app scripts tests

      - name: Pytest
        run: python -m pytest -q

  docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build backend/Dockerfile (tanpa push)
        run: docker build -t hero-backend:ci backend
