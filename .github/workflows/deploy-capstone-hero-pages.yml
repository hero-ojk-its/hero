# Deploy capstone-HERO (Vite + React) ke GitHub Pages
#
# Pages repo ini disajikan dari branch gh-pages. Workflow ini mem-build
# capstone-HERO lalu menjadikan dist/ sebagai isi root gh-pages
# (menggantikan template Next.js lama).
#
# URL: https://hero-ojk-its.github.io/hero/

name: Deploy capstone-HERO (Pages)

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-capstone-hero-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-capstone-hero
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: frontend/dist
          force_orphan: true
