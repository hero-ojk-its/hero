# Deploy capstone-HERO (Vite + React) ke GitHub Pages
#
# Pages repo ini disajikan dari branch gh-pages. Workflow ini mem-build
# capstone-HERO lalu menaruh hasil dist/ di gh-pages/capstone-HERO/,
# tanpa menyentuh isi gh-pages yang lain (keep_files).
#
# URL: https://hero-ojk-its.github.io/hero/capstone-HERO/

name: Deploy capstone-HERO (Pages)

on:
  push:
    branches: [main]
    paths: ['capstone-HERO/**', '.github/workflows/deploy-capstone-hero-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-capstone-hero
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: capstone-HERO }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capstone-HERO/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: capstone-HERO/dist
          destination_dir: capstone-HERO
          keep_files: true
