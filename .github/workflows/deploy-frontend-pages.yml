# Deploy frontend (capstone-HERO, Vite + React) ke GitHub Pages
#
# Prasyarat sekali jalan: Settings > Pages > Source = "GitHub Actions".
# Catatan: GitHub Pages dari repo private memerlukan plan GitHub berbayar
# (Team/Enterprise); pada plan Free repo harus public.
#
# Pull request hanya menjalankan lint + build sebagai pengecekan;
# deploy hanya terjadi saat push ke main atau dijalankan manual.

name: Deploy Frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['capstone-HERO/**', '.github/workflows/deploy-frontend-pages.yml']
  pull_request:
    paths: ['capstone-HERO/**', '.github/workflows/deploy-frontend-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: capstone-HERO }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capstone-HERO/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Situs proyek: https://<org>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
      # Fallback SPA: GitHub Pages menyajikan 404.html untuk rute seperti /knowledge
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: capstone-HERO/dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
