# Deploy otomatis ke VPS setelah CI hijau di main.
#
#   Backend CI  hijau di main  →  bangun image di runner → dorong ke GHCR → VPS menarik & mengganti
#   Pipeline CI hijau di main  →  kirim kode lapisan data → VPS menimpa kode & merestart layanan
#
# Frontend TIDAK ada di sini: Vercel dan GitHub Pages sudah deploy sendiri.
#
# Server LOKAL (di balik NAT) tidak memakai jalur SSH di bawah — GitHub tidak dapat
# menghubunginya. Yang dipakai hanya job "bangun image": server lokal memeriksa sendiri
# tag `:main` di GHCR secara berkala. Lihat deploy/lokal/README.md.
#
# Pengaman:
#  - hanya jalan bila CI-nya SUKSES dan itu push ke main (bukan PR, bukan fork);
#  - environment `vps-production`: tambahkan Required reviewers di Settings → Environments
#    bila ingin satu klik persetujuan sebelum menyentuh produksi (disarankan untuk backend,
#    karena migrasi basis data);
#  - satu deploy pada satu waktu (concurrency), tidak pernah dibatalkan di tengah jalan;
#  - skrip di VPS membuat cadangan, melatih migrasi pada SALINAN data, lalu memverifikasi
#    /health dan mengembalikan image lama bila gagal (lihat deploy/vps/README.md).
#
# Rahasia (Environment `vps-production`): VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS.
# Saklar: variabel repo DEPLOY_VPS_ENABLED=true mengaktifkan deploy otomatis (default mati).
# Persiapan satu kali: deploy/vps/README.md.

name: Deploy VPS

on:
  workflow_run:
    workflows: ['Backend CI', 'Pipeline CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      komponen:
        description: 'Komponen yang dideploy'
        type: choice
        options: [backend, pipeline]
        required: true
      sha:
        description: 'Commit yang dideploy (kosong = ujung main)'
        required: false
      gladi_saja:
        description: 'Backend: hanya gladi (tarik image, cadangan, uji migrasi pada salinan) tanpa mengganti produksi'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vps-deploy
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/hero-ojk-its/hero-backend

jobs:
  tentukan:
    name: Tentukan apa yang dideploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Dari CI: hanya bila SUKSES, berasal dari push ke main, DAN saklar DEPLOY_VPS_ENABLED=true.
    # Saklar itu (Settings → Secrets and variables → Actions → Variables) membuat PR ini aman
    # di-merge sebelum persiapan selesai, dan menjadi tombol darurat: set ke false untuk
    # menghentikan deploy otomatis seketika. Menjalankan manual (workflow_dispatch) selalu boleh.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_VPS_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      komponen: ${{ steps.t.outputs.komponen }}
      sha: ${{ steps.t.outputs.sha }}
      gladi: ${{ steps.t.outputs.gladi }}
    steps:
      - id: t
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_KOMPONEN: ${{ inputs.komponen }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_GLADI: ${{ inputs.gladi_saja }}
          GITHUB_SHA_NOW: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            komponen="$INPUT_KOMPONEN"
            sha="${INPUT_SHA:-$GITHUB_SHA_NOW}"
            gladi="$INPUT_GLADI"
          else
            case "$WORKFLOW_RUN_NAME" in
              'Backend CI')  komponen=backend ;;
              'Pipeline CI') komponen=pipeline ;;
              *) echo "workflow tak dikenal: $WORKFLOW_RUN_NAME" >&2; exit 1 ;;
            esac
            sha="$WORKFLOW_RUN_SHA"
            gladi=false
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "sha tidak valid: $sha" >&2; exit 1; }
          {
            echo "komponen=$komponen"
            echo "sha=$sha"
            echo "gladi=$gladi"
          } >>"$GITHUB_OUTPUT"
          echo "### Deploy VPS: \`$komponen\` @ \`${sha:0:7}\`" >>"$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ backend
  bangun-backend:
    name: Bangun image backend
    needs: tentukan
    if: needs.tentukan.outputs.komponen == 'backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tentukan.outputs.sha }}
      - id: meta
        env:
          SHA: ${{ needs.tentukan.outputs.sha }}
        run: |
          set -euo pipefail
          # Dua tag: yang tetap (per commit) untuk ketertelusuran dan pemulihan, dan
          # tag bergerak `main` yang diawasi server lokal di balik NAT — ia memeriksa
          # digest tag ini secara berkala karena GitHub tidak bisa menghubunginya.
          {
            echo "image=${IMAGE_REPO}:${SHA:0:12}"
            echo "tags=${IMAGE_REPO}:${SHA:0:12},${IMAGE_REPO}:main"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Mengaitkan paket GHCR dengan repo ini: tanpa label ini token job di VPS bisa saja
          # tak berhak menarik image-nya (paket baru tampil "tidak terhubung" ke repo).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.tentukan.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy backend ke VPS
    needs: [tentukan, bangun-backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: vps-production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Siapkan SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" >~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" >~/.ssh/known_hosts
      - name: Jalankan deploy di VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE: ${{ needs.bangun-backend.outputs.image }}
          GLADI: ${{ needs.tentukan.outputs.gladi }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          perintah="deploy-backend $IMAGE"
          # Token registri lewat stdin (bukan argumen), supaya tak muncul di daftar proses.
          # Mode gladi memakai perintah terpisah yang dikenali ci-entry.sh (DRY_RUN=1).
          if [ "$GLADI" = "true" ]; then perintah="deploy-backend-gladi $IMAGE"; fi
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" "$perintah"
      - name: Ringkasan
        if: always()
        env:
          IMAGE: ${{ needs.bangun-backend.outputs.image }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Backend → VPS: $STATUS"
            echo "Image: \`$IMAGE\`"
          } >>"$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------- pipeline
  deploy-pipeline:
    name: Deploy lapisan data ke VPS
    needs: tentukan
    if: needs.tentukan.outputs.komponen == 'pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vps-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tentukan.outputs.sha }}
      - name: Siapkan SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" >~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" >~/.ssh/known_hosts
      - name: Kirim kode dan deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          tar czf - --exclude='__pycache__' --exclude='*.pyc' \
            pipeline/hero pipeline/pyproject.toml \
            | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o BatchMode=yes -o ServerAliveInterval=30 \
                "$VPS_USER@$VPS_HOST" "deploy-pipeline"
      - name: Ringkasan
        if: always()
        env:
          SHA: ${{ needs.tentukan.outputs.sha }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Lapisan data → VPS: $STATUS"
            echo "Commit: \`${SHA:0:7}\`"
          } >>"$GITHUB_STEP_SUMMARY"
