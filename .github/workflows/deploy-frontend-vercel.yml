# Deploy frontend ke Vercel Hobby dari repo organisasi private
#
# Mengapa lewat Actions, bukan integrasi Git Vercel:
#   Vercel Hobby tidak bisa terhubung langsung ke repo private milik organisasi.
#   Workflow ini menjalankan Vercel CLI memakai token akun Hobby personal,
#   sehingga repo tetap private di organisasi dan deploy tetap gratis.
#
# Rahasia yang harus diisi di Settings > Secrets and variables > Actions:
#   VERCEL_TOKEN        token dari akun Hobby personal (vercel.com/account/tokens)
#   VERCEL_ORG_ID       dari berkas .vercel/project.json setelah `vercel link`
#   VERCEL_PROJECT_ID   dari berkas .vercel/project.json setelah `vercel link`
#
# Workflow ini hanya berjalan bila ada perubahan di folder frontend/.
# Selama folder itu belum ada, workflow tidak akan pernah terpicu.

name: Deploy Frontend (Vercel)

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  pull_request:
    paths: ['frontend/**']
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    name: Preview (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview frontend: ${{ steps.deploy.outputs.url }}`
            })

  production:
    name: Production (main)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
