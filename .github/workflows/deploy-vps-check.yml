# Menjaga mesin deploy ke VPS tetap benar: skrip bash (shellcheck), workflow (actionlint),
# dan uji logika dengan docker/curl/systemctl palsu (urutan langkah, pemulihan, penolakan
# perintah berbahaya). TIDAK menyentuh server — deploy sungguhan ada di deploy-vps.yml.

name: Deploy VPS (cek)

on:
  pull_request:
    paths: ['deploy/vps/**', '.github/workflows/deploy-vps.yml', '.github/workflows/deploy-vps-check.yml']
  push:
    branches: [main]
    paths: ['deploy/vps/**', '.github/workflows/deploy-vps.yml', '.github/workflows/deploy-vps-check.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cek:
    name: shellcheck, actionlint, uji skrip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Versi dipin lewat image: shellcheck bawaan runner berbeda versi dan menamai pemeriksaan
      # yang sama dengan kode lain (SC2317 vs SC2329), sehingga hasil lokal != hasil CI.
      - name: shellcheck (v0.11.0)
        run: |
          docker run --rm -v "$PWD/deploy/vps:/mnt:ro" koalaman/shellcheck:v0.11.0 \
            -x -S style /mnt/ci-entry.sh /mnt/deploy-backend.sh /mnt/deploy-pipeline.sh /mnt/tests/test_deploy.sh
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color=false .github/workflows/deploy-vps.yml .github/workflows/deploy-vps-check.yml
      - name: Uji logika skrip deploy
        run: bash deploy/vps/tests/test_deploy.sh
