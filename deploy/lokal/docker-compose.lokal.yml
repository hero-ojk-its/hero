# HERO di server LOKAL: Postgres+pgvector dan backend FastAPI, keduanya hanya di loopback.
# Akses dari internet lewat Cloudflare Tunnel (cloudflared), jadi TIDAK ada Caddy di sini
# dan tidak ada port yang perlu dibuka di router. Tunnel yang menyediakan HTTPS.
#
# Dijalankan dari /opt/hero:  sudo docker compose up -d
# Image backend TIDAK dibangun di sini — ditarik dari GHCR oleh ci/deploy-backend.sh.
name: hero

services:
  db:
    image: ankane/pgvector:v0.5.0
    container_name: hero_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hero_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-hero_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/backend/init_db:/docker-entrypoint-initdb.d:ro
    # Hanya loopback: database tidak pernah terdengar dari jaringan rumah.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hero_user} -d ${POSTGRES_DB:-hero_db}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  backend:
    # Tag awal; deploy-backend.sh menimpanya dengan digest lewat .deploy/docker-compose.image.yml
    image: ghcr.io/hero-ojk-its/hero-backend:main
    container_name: hero_backend
    restart: unless-stopped
    env_file: [./backend/.env.prod]
    environment:
      STORAGE_PATH: /app/storage
      LOCAL_SOURCE_ROOTS: /app/sources
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - storage_data:/app/storage
      - ./sources:/app/sources:ro
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

networks:
  internal:
    name: hero_internal

volumes:
  pgdata:
  storage_data:
